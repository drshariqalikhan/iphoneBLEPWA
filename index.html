<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ESP32 MPU6050</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MPU6050" />
  <meta name="theme-color" content="#12161a" />

  <!-- Embedded Web App Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "ESP32 MPU6050 Monitor",
    "short_name": "MPU6050",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#12161a",
    "theme_color": "#12161a",
    "icons": [{
      "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22192%22 height=%22192%22><rect width=%22192%22 height=%22192%22 fill=%22%2300d1b2%22/><text x=%2250%%22 y=%2255%%22 font-size=%2280%22 text-anchor=%22middle%22 fill=%22white%22 dy=%22.3em%22>⚡</text></svg>",
      "sizes": "192x192",
      "type": "image/svg+xml"
    }]
  }' />

  <!-- Bulma 1.0 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      background-color: #12161a;
    }
    .gyro-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto;
      border-radius: 50%;
      border: 3px solid #00d1b2;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 0 25px rgba(0, 209, 178, 0.25);
    }
    .horizon {
      position: absolute;
      width: 440px;
      height: 440px;
      top: -110px;
      left: -110px;
      background: linear-gradient(to bottom, #1976d2 50%, #5d4037 50%);
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90px;
      height: 4px;
      background-color: #ffe082;
      transform: translate(-50%, -50%);
      border-radius: 2px;
      box-shadow: 0 0 6px rgba(0,0,0,0.9);
      z-index: 2;
    }
    .crosshair::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      border: 2px solid #ffe082;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .stat-value {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
      font-size: 2.2rem;
      font-weight: 700;
    }
  </style>
</head>

<body class="p-4">
  <div class="container" style="max-width: 480px;">
    
    <header class="level is-mobile mb-4">
      <div class="level-left">
        <h1 class="title is-4 has-text-light">ESP32 MPU6050</h1>
      </div>
      <div class="level-right">
        <span id="statusTag" class="tag is-danger is-light">Disconnected</span>
      </div>
    </header>

    <!-- Visual Orientation Horizon -->
    <div class="box has-background-dark-bold has-text-centered mb-4">
      <div class="gyro-container">
        <div id="horizon" class="horizon"></div>
        <div class="crosshair"></div>
      </div>
      <p class="is-size-7 has-text-grey mt-2">Zero-Lag Hardware Accelerated Render</p>
    </div>

    <!-- Stats -->
    <div class="columns is-mobile mb-3">
      <div class="column">
        <div class="box has-background-dark-bold has-text-centered">
          <p class="heading has-text-grey">Roll</p>
          <p class="stat-value has-text-info" id="valRoll">0.0°</p>
        </div>
      </div>
      <div class="column">
        <div class="box has-background-dark-bold has-text-centered">
          <p class="heading has-text-grey">Pitch</p>
          <p class="stat-value has-text-primary" id="valPitch">0.0°</p>
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <button id="btnConnect" class="button is-primary is-fullwidth is-medium mb-3">Connect ESP32</button>
    <button id="btnDisconnect" class="button is-danger is-outlined is-fullwidth is-hidden mb-3">Disconnect</button>
  </div>

  <script>
    const SERVICE_UUID = '00001234-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '00005678-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let bleChar = null;

    // Direct variable caching to avoid layout recalculation
    let targetRoll = 0;
    let targetPitch = 0;
    let lastTextUpdate = 0;

    const statusTag = document.getElementById('statusTag');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const valRoll = document.getElementById('valRoll');
    const valPitch = document.getElementById('valPitch');
    const horizon = document.getElementById('horizon');

    // 60FPS UI Render Loop decoupled from Bluetooth packets
    function render() {
      // Clamped translation for pitch (-45° to +45°)
      const clampedPitch = Math.max(-45, Math.min(45, targetPitch));
      const translateY = clampedPitch * 1.8;
      
      // Hardware-accelerated translate3d
      horizon.style.transform = `translate3d(0, ${translateY}px, 0) rotate(${targetRoll}deg)`;

      // Throttle text node updates to 10Hz to prevent DOM reflow lag
      const now = performance.now();
      if (now - lastTextUpdate > 100) {
        valRoll.textContent = targetRoll.toFixed(1) + '°';
        valPitch.textContent = targetPitch.toFixed(1) + '°';
        lastTextUpdate = now;
      }

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // Fast Binary Data unpacking directly from DataView (8 bytes)
    function handleNotification(event) {
      const dataView = event.target.value;
      if (dataView.byteLength >= 8) {
        // Read 32-bit floats (Little Endian from ESP32)
        targetRoll = dataView.getFloat32(0, true);
        targetPitch = dataView.getFloat32(4, true);
      }
    }

    btnConnect.addEventListener('click', async () => {
      try {
        statusTag.textContent = 'Scanning...';
        statusTag.className = 'tag is-warning is-light';

        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32-MPU' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        statusTag.textContent = 'Connecting...';
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleChar = await service.getCharacteristic(CHARACTERISTIC_UUID);

        // Start native push notifications
        await bleChar.startNotifications();
        bleChar.addEventListener('characteristicvaluechanged', handleNotification);

        statusTag.textContent = 'Connected (Push)';
        statusTag.className = 'tag is-success is-light';
        btnConnect.classList.add('is-hidden');
        btnDisconnect.classList.remove('is-hidden');
      } catch (err) {
        console.error('BLE error:', err);
        onDisconnected();
      }
    });

    btnDisconnect.addEventListener('click', () => {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
      onDisconnected();
    });

    function onDisconnected() {
      if (bleChar) {
        try {
          bleChar.removeEventListener('characteristicvaluechanged', handleNotification);
        } catch (_) {}
      }
      bleChar = null;
      statusTag.textContent = 'Disconnected';
      statusTag.className = 'tag is-danger is-light';
      btnConnect.classList.remove('is-hidden');
      btnDisconnect.classList.add('is-hidden');
    }

    // Minimalist Service Worker
    if ('serviceWorker' in navigator) {
      const sw = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));`;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'application/javascript'}))).catch(() => {});
    }
  </script>
</body>
</html>
